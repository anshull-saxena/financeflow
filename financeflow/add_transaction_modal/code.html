<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d968b",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102220",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Personal Finance - Add Transaction</title>
</head>
<body class="font-display bg-slate-200/50 dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
<!-- Modal Container -->
<div class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Modal Header -->
<header class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-3">
<div class="size-10 bg-primary/10 rounded-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined">payments</span>
</div>
<div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight">Add Transaction</h2>
<p class="text-slate-500 dark:text-slate-400 text-xs">Record a new financial entry</p>
</div>
</div>
<button class="size-8 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 transition-colors">
<span class="material-symbols-outlined text-xl">close</span>
</button>
</header>
<!-- Modal Body / Form -->
<div class="p-6 space-y-5">
<!-- Type Toggle -->
<div class="space-y-2">
<p class="text-sm font-semibold text-slate-700 dark:text-slate-300">Transaction Type</p>
<div class="flex p-1 bg-slate-100 dark:bg-slate-800 rounded-lg">
<label class="flex-1">
<input checked="" class="peer hidden" name="type" type="radio"/>
<div class="flex items-center justify-center gap-2 py-2 rounded-md cursor-pointer text-sm font-medium transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-red-500 text-lg">trending_down</span>
                                Expense
                            </div>
</label>
<label class="flex-1">
<input class="peer hidden" name="type" type="radio"/>
<div class="flex items-center justify-center gap-2 py-2 rounded-md cursor-pointer text-sm font-medium transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-slate-900 dark:peer-checked:text-white peer-checked:shadow-sm text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-primary text-lg">trending_up</span>
                                Income
                            </div>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-5">
<!-- Amount Input -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Amount</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium">₹</span>
<input class="w-full pl-8 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100 font-medium" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<!-- Date Picker -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Date</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-lg">calendar_today</span>
<input class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100" type="date"/>
</div>
</div>
</div>
<!-- Category Dropdown -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Category</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined text-lg">category</span>
<select class="w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all appearance-none text-slate-900 dark:text-slate-100">
<option value="">Select a category</option>
<option value="food">🍔 Food &amp; Dining</option>
<option value="transport">🚗 Transportation</option>
<option value="shopping">🛍️ Shopping</option>
<option value="housing">🏠 Housing</option>
<option value="entertainment">🎮 Entertainment</option>
<option value="health">🏥 Health &amp; Medical</option>
</select>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 material-symbols-outlined pointer-events-none">expand_more</span>
</div>
</div>
<!-- Description Text Area -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Description</label>
<textarea class="w-full px-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100 resize-none" placeholder="What was this for?" rows="3"></textarea>
</div>
</div>
<!-- Modal Footer -->
<footer class="px-6 py-6 bg-slate-50 dark:bg-slate-800/50 flex flex-col-reverse sm:flex-row gap-3 border-t border-slate-100 dark:border-slate-800">
<button class="flex-1 px-6 py-3 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Cancel
                </button>
<button class="flex-[2] px-6 py-3 rounded-lg bg-primary text-white font-semibold hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg">check_circle</span>
                    Save Transaction
                </button>
</footer>
</div>
</div>
</body></html>
