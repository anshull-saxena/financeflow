<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FinanceFlow Premium Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00f2ff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0a0f16",
                        "accent-purple": "#a855f7",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .mesh-gradient {
            background-color: #0a0f16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(10, 15, 22, 1) 0px, transparent 80%);
        }
        .grid-pattern {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }
        .input-glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-glass:focus-within {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen selection:bg-primary/30">
<div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden mesh-gradient">
<!-- Background Grid -->
<div class="absolute inset-0 grid-pattern pointer-events-none"></div>
<!-- Animated-like elements (Static Gradients) -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent-purple/10 blur-[120px] rounded-full"></div>
<div class="z-10 w-full max-w-[540px] px-6">
<!-- Glassmorphic Card -->
<div class="glass-card rounded-3xl p-10 md:p-14 flex flex-col items-center">
<!-- Logo -->
<div class="mb-10 flex flex-col items-center gap-4">
<div class="size-16 bg-primary/10 rounded-2xl flex items-center justify-center border border-primary/20 neon-glow">
<svg class="size-10 text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-3xl font-black tracking-tight text-white">FinanceFlow</h1>
</div>
<!-- Welcome Text -->
<div class="text-center mb-10">
<h2 class="text-white text-4xl font-bold leading-tight tracking-tight mb-3">Welcome Back</h2>
<p class="text-[#8e9bb0] text-lg font-normal">Enter your credentials to access your dashboard.</p>
</div>
<!-- Form -->
<form id="loginForm" class="w-full space-y-6">
<div class="space-y-2">
<label class="block text-sm font-medium text-[#8e9bb0] ml-1">Email Address</label>
<div class="input-glass rounded-xl flex items-center px-4 py-1">
<span class="material-symbols-outlined text-[#8e9bb0] mr-3">mail</span>
<input id="emailInput" class="bg-transparent border-none focus:ring-0 text-white w-full py-3 placeholder:text-slate-600" placeholder="name@company.com" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-medium text-[#8e9bb0]">Password</label>
<a class="text-sm font-medium text-[#8e9bb0] hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="input-glass rounded-xl flex items-center px-4 py-1">
<span class="material-symbols-outlined text-[#8e9bb0] mr-3">lock</span>
<input id="passwordInput" class="bg-transparent border-none focus:ring-0 text-white w-full py-3 placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<button class="text-[#8e9bb0] hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<button class="w-full bg-primary text-background-dark font-bold text-lg py-4 rounded-xl neon-glow hover:brightness-110 active:scale-[0.98] transition-all transform mt-4" type="submit">
                        Sign In
                    </button>
</form>
<!-- Footer Links -->
<div class="mt-10 text-center">
<p class="text-[#8e9bb0]">
                        Don't have an account? 
                        <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Subtle Security Badge -->
<div class="mt-8 flex items-center justify-center gap-2 text-[#8e9bb0]/50 text-xs uppercase tracking-widest font-bold">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>End-to-End Encrypted Architecture</span>
</div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        
        if (password === 'admin123' || (email === 'admin' && password === 'admin')) {
            window.location.href = 'dashboard.html';
        } else {
            alert('Invalid credentials. Hint: use password "admin123"');
        }
    });
</script>
</body></html>
