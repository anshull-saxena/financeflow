<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceFlow - Sign Up</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
    <script>
      (function () {
        const isDark = localStorage.getItem('ff_darkMode');
        if (isDark === 'false') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 p-6 overflow-y-auto">
    <div class="w-full max-w-md mx-auto my-8 rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl">
      <div class="mb-8">
        <h1 class="text-3xl font-black tracking-tight text-white">Create your account</h1>
        <p class="text-slate-400 mt-2 text-sm">
          Basic signup (demo mode). Your profile is stored locally on this device.
        </p>
        <div class="mt-4 p-3 rounded-lg bg-cyan-400/10 border border-cyan-400/20">
          <p class="text-cyan-400 text-xs font-semibold">💡 Demo Tip</p>
          <p class="text-slate-300 text-xs mt-1">
            Or use demo login: <span class="text-white font-mono">demo@financeflow.local</span> / <span class="text-white font-mono">demo123</span>
          </p>
        </div>
      </div>

      <form id="signupForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Name</label>
          <input
            id="signupName"
            type="text"
            class="w-full rounded-xl bg-black/20 border border-white/10 px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 outline-none"
            placeholder="e.g. Arushi"
            required
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Email</label>
          <input
            id="signupEmail"
            type="email"
            class="w-full rounded-xl bg-black/20 border border-white/10 px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 outline-none"
            placeholder="you@example.com"
            required
          />
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Password (optional)</label>
          <input
            id="signupPassword"
            type="password"
            class="w-full rounded-xl bg-black/20 border border-white/10 px-4 py-3 text-white placeholder:text-slate-600 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 outline-none"
            placeholder="••••••••"
          />
          <p class="text-[11px] text-slate-500 mt-2">In demo mode, password is not validated or stored.</p>
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-cyan-400 text-slate-900 font-black py-3 hover:brightness-110 active:scale-[0.99] transition-all"
        >
          Create Account
        </button>
      </form>

      <div class="mt-6 flex items-center justify-between text-sm">
        <a href="index.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Back to login</a>
        <a href="dashboard.html" class="text-slate-400 hover:text-cyan-300 transition-colors">Skip</a>
      </div>
    </div>

    <script src="api.js"></script>
    <script src="shared_modals.js"></script>
    <script src="signup.js"></script>
  </body>
</html>
