<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FinanceFlow Premium Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00eeff",
                        "background-light": "#f5f8f8",
                        "background-dark": "#0a0f16",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .mesh-gradient {
            background: 
                radial-gradient(circle at 0% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 238, 255, 0.15) 0%, transparent 50%);
        }
        .grid-pattern {
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-button {
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  
    <!-- Theme Toggle Logic -->
    <script>
        (function() {
            const isDark = localStorage.getItem('ff_darkMode');
            if (isDark === 'false') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }
        })();
    </script>
    <style>
        /* Light Mode Overrides generated by Stitch Design Loop */
        html.light body, html.light .bg-background-dark, html.light .bg-\[\#0a0f16\] { background-color: #f8fafc !important; }
        html.light .text-white, html.light .text-slate-100 { color: #0f172a !important; }
        html.light .text-slate-300, html.light .text-slate-400, html.light .text-slate-500, html.light .text-\[\#8e9bb0\] { color: #475569 !important; }
        html.light .bg-white\/5, html.light .glass, html.light .glass-card { background: rgba(255,255,255,0.85) !important; border-color: rgba(0,0,0,0.1) !important; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05) !important; }
        html.light .border-white\/10 { border-color: rgba(0,0,0,0.15) !important; }
        /* mesh-gradient fixed */
        html.light .grid-pattern { background-image: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px) !important; }
        html.light .bg-primary { color: #0f172a !important; }
        html.light .bg-black\/20, html.light .bg-white\/10 { background-color: rgba(0,0,0,0.05) !important; }
        html.light .glow-button { box-shadow: 0 4px 15px rgba(0, 238, 255, 0.5) !important; }
        html.light #appAlertModal > div, html.light #appConfirmModal > div, html.light #appPromptModal > div { background: rgba(255,255,255,0.9) !important; border-color: rgba(0,0,0,0.1) !important; }
    </style>
</head>

<body class="bg-background-dark text-slate-100 min-h-screen flex items-center justify-center font-display overflow-hidden relative">
<div class="fixed inset-0 mesh-gradient z-0"></div>
<div class="fixed inset-0 grid-pattern z-0"></div>
<main class="relative z-10 w-full max-w-md px-6">
<div class="glass-card rounded-3xl p-8 md:p-10 flex flex-col items-center relative">
<div class="w-full flex justify-between items-center mb-10">
<div class="flex items-center gap-2">
<div class="bg-primary/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-2xl">account_balance_wallet</span>
</div>
<span class="text-slate-100 font-bold tracking-tight text-xl">FinanceFlow</span>
</div>
<a href="index.html" class="text-slate-400 hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</a>
</div>
<div class="w-full mb-8">
<h1 class="text-white text-3xl font-bold leading-tight mb-2">Welcome to FinanceFlow</h1>
<p class="text-[#8e9bb0] text-base">Let's build your profile</p>
</div>
<form id="onboardingForm" class="w-full space-y-6">
<div class="space-y-2">
<label class="text-slate-300 text-sm font-medium ml-1">Email Address</label>
<div class="relative group">
<input id="obEmail" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="e.g. name@example.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-300 text-sm font-medium ml-1">Full Name</label>
<div class="relative group">
<input id="obName" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="e.g. Alex Rivera" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-300 text-sm font-medium ml-1">Password</label>
<div class="relative group">
<input id="obPassword" required class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="Create a secure password" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-300 text-sm font-medium ml-1">Primary Currency</label>
<div class="relative">
<select id="obCurrency" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white appearance-none focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all">
<option value="INR" selected>INR - Indian Rupee</option>
<option value="USD">USD - US Dollar</option>
<option value="EUR">EUR - Euro</option>
<option value="GBP">GBP - British Pound</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="text-slate-300 text-sm font-medium ml-1">Monthly Income Goal</label>
<div class="relative flex items-center">
<span id="currencySymbol" class="absolute left-4 text-slate-500 font-medium">₹</span>
<input id="obGoal" required class="w-full bg-white/5 border border-white/10 rounded-xl pl-8 pr-4 py-4 text-white placeholder:text-slate-600 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all" placeholder="50000" type="number"/>
</div>
</div>
<div class="pt-6 space-y-4">
<button type="submit" class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 rounded-xl transition-all glow-button">
                        Complete Setup
                    </button>
<div class="text-center">
<button type="button" id="obSkip" class="text-[#8e9bb0] text-sm hover:text-white transition-colors underline-offset-4 decoration-[#8e9bb0]/30 hover:underline">
                            Skip for now
                        </button>
</div>
</div>
</form>
</div>
<div class="mt-8 flex justify-center gap-1.5">
<div class="h-1.5 w-8 bg-primary rounded-full"></div>
<div class="h-1.5 w-1.5 bg-white/20 rounded-full"></div>
<div class="h-1.5 w-1.5 bg-white/20 rounded-full"></div>
</div>
</main>
<div class="fixed top-12 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/10 blur-[120px] rounded-full z-0 pointer-events-none"></div>
<script src="api.js"></script>
<script src="shared_modals.js"></script>
<script>
    const currencyMap = { 'USD': '₹', 'EUR': '€', 'GBP': '£', 'INR': '₹' };
    const obCurrency = document.getElementById('obCurrency');
    const currencySymbol = document.getElementById('currencySymbol');

    // Migrate legacy key
    if (!localStorage.getItem('ff_userEmail') && localStorage.getItem('ff_email')) {
        localStorage.setItem('ff_userEmail', localStorage.getItem('ff_email'));
    }
    
    document.getElementById('obName').value = localStorage.getItem('ff_userName') || '';
    document.getElementById('obEmail').value = localStorage.getItem('ff_userEmail') || '';
    
    obCurrency.addEventListener('change', (e) => {
        currencySymbol.textContent = currencyMap[e.target.value] || '₹';
    });

    document.getElementById('onboardingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('obName').value.trim();
        const email = document.getElementById('obEmail').value.trim();
        const password = document.getElementById('obPassword').value;
        const cur = document.getElementById('obCurrency').value;
        const goal = document.getElementById('obGoal').value;
        const submitBtn = this.querySelector('button[type="submit"]');
        
        try {
            submitBtn.textContent = 'Creating Account...';
            submitBtn.disabled = true;
            
            // 1. Create the account
            const sigReq = await API.post('/auth/signup', { name, email, password });
            API.setToken(sigReq.token);
            
            // 2. Set the initial user settings
            await API.put('/settings', {
                currency: cur,
                monthlyGoal: goal,
                emailNotif: true,
                darkMode: true,
                twoFactor: false
            });

            // Local fallback caching
            localStorage.setItem('ff_userName', name);
            localStorage.setItem('ff_userEmail', email);

            await window.showAppAlert('Profile saved! Redirecting to your dashboard...', 'Success');
            window.location.href = 'dashboard.html';
        } catch(error) {
            window.showAppAlert(error.message || 'Signup failed', 'Error');
        } finally {
            submitBtn.textContent = 'Complete Setup';
            submitBtn.disabled = false;
        }
    });

    document.getElementById('obSkip').addEventListener('click', async function() {
        if(await window.showAppConfirm('Are you sure you want to skip? You can complete your profile later in settings.', 'Skip Onboarding')) {
            window.location.href = 'dashboard.html';
        }
    });
</script>
</body></html>
