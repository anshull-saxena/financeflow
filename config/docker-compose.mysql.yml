name: financeflow

services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-financeflow}
      MYSQL_USER: ${MYSQL_USER:-financeflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-financeflow}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - financeflow_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  financeflow_mysql_data:

